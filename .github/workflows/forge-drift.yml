name: Forge configuration drift

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.2"
          check-latest: true
      - name: Check governed project state when configured
        run: |
          if test -f .forge/forge.yaml; then
            go run ./cmd/harnessforge check --repository . --layout forge --format json
          elif test -f .harness/harness.yaml; then
            go run ./cmd/harnessforge check --repository . --layout harness --format json
          else
            echo "No HarnessForge project layout; skipping drift check."
          fi
