name: Release

on:
  push:
    tags:
      - 'v1.*'

permissions:
  contents: read

env:
  # A patched release builder, not the module's minimum supported Go version.
  GO_VERSION: 1.27.1
  # Keep gofmt output stable across runner-image updates by formatting with
  # the Go version declared as the module baseline.
  FORMAT_GO_VERSION: 1.26.2
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  quality:
    name: Formatting and module consistency
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Installers and npm require exactly three numeric version components.
          prerelease='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          pattern="^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${prerelease}(\.${prerelease})*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo '::error::Invalid release tag. Use v1.MINOR.PATCH (for example v1.1.2), optionally followed by a SemVer prerelease or build suffix. Four-component versions such as v1.1.1.2 cannot be installed. Create a new valid tag; do not move an existing tag.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.FORMAT_GO_VERSION }}
          check-latest: true
      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Check module files
        run: go mod tidy -diff

  native-test:
    name: Native test and vet (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  package-candidate:
    name: Package release candidate
    needs: native-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build an unpublished snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version-file: .tool-versions
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error

  installer-smoke:
    name: Clean installer smoke (${{ matrix.os }})
    needs: package-candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: unix
          - os: macos-latest
            script: unix
          - os: windows-latest
            script: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: candidate
      - name: Smoke-test the Unix installer
        if: matrix.script == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          checksum="$(basename candidate/harnessforge_*_checksums.txt)"
          version="${checksum#harnessforge_}"
          version="${version%_checksums.txt}"
          [ -n "$version" ] && [ "$version" != "$checksum" ]
          release_root="$RUNNER_TEMP/release/v${version}"
          mkdir -p "$release_root"
          cp "candidate/$checksum" "$release_root/"
          cp candidate/harnessforge_"${version}"_"$(uname | tr '[:upper:]' '[:lower:]')"_* "$release_root/"
          python3 -m http.server 8080 --directory "$RUNNER_TEMP/release" >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/; then
              break
            fi
            sleep 0.1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8080/
          install_dir="$RUNNER_TEMP/install"
          HARNESSFORGE_RELEASE_BASE_URL=http://127.0.0.1:8080 sh ./install.sh --version "$version" --install-dir "$install_dir"
          "$install_dir/harnessforge" version
          "$install_dir/harnessforge" --help | grep -Eq '^[[:space:]]+init[[:space:]]'
      - name: Smoke-test the Windows installer
        if: matrix.script == 'windows'
        shell: pwsh
        run: |
          $checksum = Get-ChildItem candidate -Filter 'harnessforge_*_checksums.txt' | Select-Object -First 1
          if (-not $checksum) { throw 'Release candidate checksum manifest is missing.' }
          $version = $checksum.BaseName -replace '^harnessforge_', '' -replace '_checksums$', ''
          $releaseRoot = Join-Path $env:RUNNER_TEMP "release/v$version"
          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
          Copy-Item $checksum.FullName $releaseRoot
          Copy-Item candidate/harnessforge_${version}_windows_amd64.tar.gz $releaseRoot
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8080', '--directory', (Join-Path $env:RUNNER_TEMP 'release') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:8080/' -Method Head -ErrorAction Stop | Out-Null
                $ready = $true
                break
              }
              catch {
                Start-Sleep -Milliseconds 100
              }
            }
            if (-not $ready) { throw 'The local release server did not become ready.' }
            $env:HARNESSFORGE_RELEASE_BASE_URL = 'http://127.0.0.1:8080'
            $installDir = Join-Path $env:RUNNER_TEMP 'install'
            ./install.ps1 -Version $version -InstallDir $installDir
            & (Join-Path $installDir 'harnessforge.exe') version
            $helpText = & (Join-Path $installDir 'harnessforge.exe') --help
            if (-not ($helpText -match '^\s+init\s')) { throw 'The guided init command is missing from this release.' }
          }
          finally {
            Stop-Process -Id $server.Id -Force
          }

  release:
    needs: installer-smoke
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build unpublished release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version-file: .tool-versions
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan source and release binaries for known vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
          find dist -type f \( -name harnessforge -o -name harnessforge.exe \) -print0 | xargs -0 -r -n1 go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} -mode=binary
      - name: Attest release archives and checksums
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/harnessforge_*.tar.gz
            dist/harnessforge_*_checksums.txt
      - name: Publish scanned release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/harnessforge_*.tar.gz dist/harnessforge_*_checksums.txt --generate-notes
      - name: Upload reviewed installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" install.sh install.ps1

  npm-publish:
    name: Publish npm installer
    needs: release
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Test the npm installer package
        working-directory: npm/cli
        run: |
          npm test
          npm pack --dry-run --ignore-scripts
      - name: Smoke-test the npm launcher against the published release
        working-directory: npm/cli
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm pack --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/npm-smoke" ./harnessforge-*.tgz --ignore-scripts
          node "$RUNNER_TEMP/npm-smoke/node_modules/harnessforge/cli.js" version
          node "$RUNNER_TEMP/npm-smoke/node_modules/harnessforge/cli.js" --help | grep -Eq '^[[:space:]]+init[[:space:]]'
      - name: Publish the matching npm version
        working-directory: npm/cli
        run: |
          npm publish --access public
